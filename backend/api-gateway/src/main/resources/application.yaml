server:
  port: ${SERVER_PORT}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**

            - id: category-service
              uri: ${CATEGORY_SERVICE_URL}
              predicates:
                - Path=/api/v1/categories,/api/v1/categories/**

jwt:
  secret: ${JWT_SECRET}

logging:
  structured:
    format:
      console: logstash
